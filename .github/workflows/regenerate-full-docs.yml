name: Regenerate full manuals (temporary cleanup workflow)

on:
  push:
    branches:
      - docs/public-facing-cleanup-20261121

permissions:
  contents: write

concurrency:
  group: full-manual-cleanup
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/public-facing-cleanup-20261121
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate all localized full manuals from source pages
        run: node site/scripts/build-full-doc.mjs
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build and validate all 10 locales
        working-directory: site
        run: npm run build
      - name: Check whitespace errors
        run: git diff --check
      - name: Commit generated manuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ja/00-full.md en/00-full.md es/00-full.md pt/00-full.md fr/00-full.md de/00-full.md zh-CN/00-full.md ko/00-full.md ru/00-full.md hi/00-full.md
          if ! git diff --cached --quiet; then
            git commit -m "Docs: regenerate all full manuals from cleaned source pages"
            git push origin HEAD:docs/public-facing-cleanup-20261121
          fi
